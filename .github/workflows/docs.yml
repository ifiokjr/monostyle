name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pages write access belongs to the deploy job alone. Building documentation needs only the
    # ability to read the repository, so granting it here would widen the window in which a
    # compromised build step could publish to the site.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly-2026-09-07

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install mdbook
        uses: taiki-e/install-action@8ed95cf4ff55afeb4411ad3165fa10f7ca9e7a62 # v2
        with:
          tool: mdbook

      - name: build documentation
        run: mdbook build docs

      - name: build API documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: combine book and API docs
        run: |
          mkdir -p combined
          cp -r docs/book/* combined/
          cp -r target/doc combined/api
          echo '<meta http-equiv="refresh" content="0;url=monostyle/">' > combined/api/index.html

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: combined

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # `deploy-pages` exchanges the job's OIDC identity for a Pages deployment, so both permissions
    # are required, and both are scoped to this job rather than the workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
