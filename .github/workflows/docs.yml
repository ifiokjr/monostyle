name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pages write access belongs to the deploy job alone. Building documentation needs only the
    # ability to read the repository, so granting it here would widen the window in which a
    # compromised build step could publish to the site.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-07

      - uses: Swatinem/rust-cache@v2.9.2 # v2

      - name: install mdbook
        uses: taiki-e/install-action@mdbook

      - name: build documentation
        run: mdbook build docs

      - name: build API documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: combine book and API docs
        run: |
          mkdir -p combined
          cp -r docs/book/* combined/
          cp -r target/doc combined/api
          echo '<meta http-equiv="refresh" content="0;url=monostyle/">' > combined/api/index.html

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3.0.1 # v3
        with:
          path: combined

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # `deploy-pages` exchanges the job's OIDC identity for a Pages deployment, so both permissions
    # are required, and both are scoped to this job rather than the workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5 # v4
