name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: ifiokjr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check formatting
        run: nix develop --command cargo fmt --all --check

      - name: Run clippy
        run: nix develop --command cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Run tests
        run: nix develop --command cargo nextest run --workspace --all-features

  # The tool measures readability, so it is held to its own standard. This job is what makes
  # the project's claims about its own style verifiable rather than aspirational.
  dogfood:
    name: Score this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build monostyle
        run: nix develop --command cargo build --release --package monostyle

      - name: Score the source
        run: |
          ./target/release/monostyle check crates examples \
            --fail-under "${MONOSTYLE_FAIL_UNDER:-60}" \
            --units
        env:
          MONOSTYLE_FAIL_UNDER: "60"
