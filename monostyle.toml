# monostyle's own configuration.
#
# This file is both the project's settings and a working example of the sections feature: the
# repository is held to one bar, tests to another, and the deliberately-bad examples are ignored
# entirely.
#
# # Two different numbers, and why
#
# The *target* is the project score: `monostyle check crates` reports 95.4 readability and 95.2
# complexity, and CI holds it there with `--fail-under 95`. The *floor* below is a safety net rather
# than the target. A floor of 95 per file would fail on every file that is fine but not exceptional —
# a hand-written lexer is inherently branch-heavy, and none of those files are a problem worth
# blocking a merge over. A floor of 70 catches the case that actually matters: a file that has become
# genuinely unpleasant to read.

[rules]
max-line-width = 100

# The bar for code that ships. Any single file dropping below this is a signal that something went
# wrong, so CI fails and names it.
[[section]]
path = "crates"
fail-under = { readability = 70.0, complexity = 70.0 }

# Tests may be structurally noisier than the code they exercise: a table-driven test builds data
# inline, and a fixture that reads as deeply nested is often the clearest way to express the case it
# covers. The floor is lower for the same reason the nesting limit is higher.
[[section]]
path = "crates/monostyle/tests"
reason = "tests build data inline, so nesting and long lines read differently than in source"
max-nesting-depth = 8
max-parameters-inline = 8
max-unit-lines = 200
fail-under = { readability = 60.0, complexity = 60.0 }

# The test inputs themselves, which must not be measured at all. This section is the most specific of
# the three, so it wins for everything beneath it — including `fixtures/bad/rust.rs`, which scores 0
# because the scoring tests assert that it does.
[[section]]
path = "crates/monostyle/tests/fixtures"
ignore = true
reason = "these are test inputs; bad/rust.rs scores 0 by design"

# The worked examples at the repository root, which include another deliberately-bad file.
[[section]]
path = "examples"
ignore = true
reason = "bad/rust.rs scores 0 by design; the scoring tests assert against it"
