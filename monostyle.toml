# monostyle's own configuration.
#
# The repository-wide thresholds are the defaults, so only what differs is stated here. The floors and
# sections below are what hold this project to its own standard: CI runs `monostyle check crates` and fails
# when any path falls below the bar its section sets.

# The bar for the code that ships. A reader should be able to open any file under `crates/*/src` and follow
# it, so the floor is high and the nesting limit is the default of 3.
[rules]
max-line-width = 100

# Tests may be structurally noisier than the code they exercise: a table-driven test builds data inline, and
# a fixture that reads as deeply nested is often the clearest way to express the case it covers.
[[section]]
path = "crates/monostyle/tests"
reason = "test fixtures build data inline, which reads as nesting"
max-nesting-depth = 8
max-parameters-inline = 8
max-unit-lines = 200

[[section]]
path = "crates"
fail-under = { readability = 90.0, complexity = 90.0 }

# The deliberately bad examples that the scoring tests assert against. Measuring them would report the
# quality of code written specifically to be bad.
[[section]]
path = "crates/monostyle/tests/fixtures"
ignore = true
