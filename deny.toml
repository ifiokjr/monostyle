# cargo-deny configuration.
#
# Checks advisories, licenses, and bans. See https://embarkstudios.github.io/cargo-deny/.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
# Deny a dependency with a known advisory rather than warning, because the tool ships to users.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
# `severity-threshold` was removed from cargo-deny; every advisory is denied instead, which is the
# stricter behavior this was aiming at.

[licenses]
# Only permissive licenses, so the binary can be redistributed without a legal review.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Dependencies that must not appear in the graph, with the reason.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
