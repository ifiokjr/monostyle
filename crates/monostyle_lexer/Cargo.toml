[package]
name = "monostyle_lexer"
version = "0.1.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Profile-driven tokenizer that extracts layout and complexity signals from source code."

[dependencies]
monostyle_core = { workspace = true }
monostyle_languages = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# Path-only on purpose. A versioned dev-dependency would be resolved when this crate is packaged,
# and monostyle_metrics depends on monostyle_lexer at runtime — a cycle that makes neither
# publishable, in either order. Cargo drops a path-only dev-dependency from the packaged manifest,
# so the unit-detection test still runs here while the published crate carries no such edge.
monostyle_metrics = { path = "../monostyle_metrics" }

[lints]
workspace = true
