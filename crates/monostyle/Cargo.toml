[package]
name = "monostyle"
version = "0.3.27"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Measure the complexity and readability of a codebase, a file, or a function."
# The benches and the corpus they read are development tooling, not part of the published crate.
# The corpus is also what the benchmark workflow copies into its mixed-language scenario, so it
# lives beside the bench that reads it rather than in a directory of its own.
exclude = ["benches/"]

[lib]
name = "monostyle"
path = "src/lib.rs"

[[bin]]
name = "monostyle"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
ignore = { workspace = true }
monostyle_core = { workspace = true }
monostyle_languages = { workspace = true }
monostyle_lexer = { workspace = true }
monostyle_markdown = { workspace = true }
monostyle_metrics = { workspace = true }
monostyle_rules = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "hot_paths"
harness = false

[lints]
workspace = true
